<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colour Trading App - Demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Parity</h1>
      <nav>
        <span>Supre</span>
        <span>Bcone</span>
        <span>Emerd</span>
      </nav>
      <div class="icons">
        <button aria-label="Share">↗</button>
        <button aria-label="Favorite">♡</button>
      </div>
    </header>

    <main>
      <section class="panel">
        <div>
          <h2>🏆 Period ID</h2>
          <p class="period">20230414387</p>
        </div>
        <div class="countdown">
          <h2>Count Down</h2>
          <div class="timer">00 : 34</div>
        </div>
      </section>

      <section class="actions">
        <button class="cta green">Join Green</button>
        <button class="cta violet">Join Violet</button>
        <button class="cta red">Join Red</button>
      </section>

      <section class="grid">
        <button class="tile violet-red">0</button>
        <button class="tile green">1</button>
        <button class="tile red">2</button>
        <button class="tile green">3</button>
        <button class="tile red">4</button>
        <button class="tile violet-green">5</button>
        <button class="tile red">6</button>
        <button class="tile green">7</button>
        <button class="tile red">8</button>
        <button class="tile green">9</button>
      </section>
    </main>
  </body>
</html>
